version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:9080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9080:8080"
    environment:
      - PORT=8080
      - STOCKFISH_HOST=stockfish
      - DEFAULT_MODEL=sf18
      - STOCKFISH_PORT_SF18=3333
      - STOCKFISH_PORT_SF17=3334
      - STOCKFISH_PORT_SF16=3335
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_DSN=${DB_DSN:-data/chess.db}
      - REDIS_ADDR=redis:6379
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - stockfish
      - redis

  stockfish:
    build:
      context: ./stockfish
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
      - "3334:3334"
      - "3335:3335"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
