name: CI/CD Build Check

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0, v2.0.0-rc1)
  release:
    types: [published, prereleased] # Trigger on release or prerelease publication
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  backend-check:
    name: Backend Build Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Build Go API Service
        run: go build -v -o /dev/null ./cmd/api

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Build
        run: npm run build

  docker-check:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Build
        run: docker compose build
