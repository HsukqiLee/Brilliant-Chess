name: CD Release Build & Deploy

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0, v2.1.0-alpha)
  release:
    types: [published, prereleased] # Trigger on release publish or prerelease
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Docker Tags
        id: meta
        run: |
          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base_image="ghcr.io/${owner_lower}/brilliant-chess"
          
          suffixes=()
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            suffixes+=("latest")
            suffixes+=("manual")
          elif [ "${{ github.event_name }}" = "push" ]; then
            suffixes+=("latest")
            suffixes+=("${{ github.ref_name }}")
          elif [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              suffixes+=("prerelease")
              suffixes+=("dev")
            else
              suffixes+=("stable")
              suffixes+=("latest")
            fi
          else
            suffixes+=("dev")
          fi
          
          frontend_tags=""
          backend_tags=""
          stockfish_tags=""
          
          for suffix in "${suffixes[@]}"; do
            if [ -n "$frontend_tags" ]; then
              frontend_tags="${frontend_tags},"
              backend_tags="${backend_tags},"
              stockfish_tags="${stockfish_tags},"
            fi
            frontend_tags="${frontend_tags}${base_image}/frontend:${suffix}"
            backend_tags="${backend_tags}${base_image}/backend:${suffix}"
            stockfish_tags="${stockfish_tags}${base_image}/stockfish:${suffix}"
          done
          
          echo "frontend_tags=${frontend_tags}" >> $GITHUB_OUTPUT
          echo "backend_tags=${backend_tags}" >> $GITHUB_OUTPUT
          echo "stockfish_tags=${stockfish_tags}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Stockfish Image
        uses: docker/build-push-action@v7
        with:
          context: ./stockfish
          file: ./stockfish/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.stockfish_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
