name: CD Release Build & Deploy

on:
  push:
    tags:
      - "v*" # Trigger on version tags (e.g. v1.0.0, v2.1.0-alpha)
  release:
    types: [published, prereleased] # Trigger on release publish or prerelease
  workflow_dispatch: # Allows manual trigger from Actions tab
    inputs:
      build_frontend:
        description: "Build frontend image"
        type: boolean
        default: true
      build_frontend_full:
        description: "Build frontend-full image (Nginx bundled)"
        type: boolean
        default: true
      build_backend:
        description: "Build backend image"
        type: boolean
        default: true
      build_stockfish:
        description: "Build stockfish image"
        type: boolean
        default: true

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Calculate Docker Tags
        id: meta
        run: |
          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base_image="ghcr.io/${owner_lower}/brilliant-chess"

          suffixes=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            suffixes+=("latest")
            suffixes+=("manual")
          elif [ "${{ github.event_name }}" = "push" ]; then
            suffixes+=("latest")
            suffixes+=("${{ github.ref_name }}")
          elif [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              suffixes+=("prerelease")
              suffixes+=("dev")
            else
              suffixes+=("stable")
              suffixes+=("latest")
            fi
          else
            suffixes+=("dev")
          fi

          frontend_tags=""
          frontend_full_tags=""
          backend_tags=""
          stockfish_tags=""
          stockfish_sse41_tags=""
          stockfish_avx2_tags=""
          stockfish_bmi2_tags=""
          stockfish_avx512_tags=""
          stockfish_vnni512_tags=""

          for suffix in "${suffixes[@]}"; do
            if [ -n "$frontend_tags" ]; then
              frontend_tags="${frontend_tags},"
              frontend_full_tags="${frontend_full_tags},"
              backend_tags="${backend_tags},"
              stockfish_tags="${stockfish_tags},"
              stockfish_sse41_tags="${stockfish_sse41_tags},"
              stockfish_avx2_tags="${stockfish_avx2_tags},"
              stockfish_bmi2_tags="${stockfish_bmi2_tags},"
              stockfish_avx512_tags="${stockfish_avx512_tags},"
              stockfish_vnni512_tags="${stockfish_vnni512_tags},"
            fi
            frontend_tags="${frontend_tags}${base_image}/frontend:${suffix}"
            frontend_full_tags="${frontend_full_tags}${base_image}/frontend-full:${suffix}"
            backend_tags="${backend_tags}${base_image}/backend:${suffix}"
            stockfish_tags="${stockfish_tags}${base_image}/stockfish:${suffix}"
            stockfish_sse41_tags="${stockfish_sse41_tags}${base_image}/stockfish:${suffix}-sse41-popcnt"
            stockfish_avx2_tags="${stockfish_avx2_tags}${base_image}/stockfish:${suffix}-avx2"
            stockfish_bmi2_tags="${stockfish_bmi2_tags}${base_image}/stockfish:${suffix}-bmi2"
            stockfish_avx512_tags="${stockfish_avx512_tags}${base_image}/stockfish:${suffix}-avx512"
            stockfish_vnni512_tags="${stockfish_vnni512_tags}${base_image}/stockfish:${suffix}-vnni512"
          done

          # Also add short tags if "latest" is built
          for suffix in "${suffixes[@]}"; do
            if [ "$suffix" = "latest" ]; then
              stockfish_sse41_tags="${stockfish_sse41_tags},${base_image}/stockfish:sse41-popcnt"
              stockfish_avx2_tags="${stockfish_avx2_tags},${base_image}/stockfish:avx2"
              stockfish_bmi2_tags="${stockfish_bmi2_tags},${base_image}/stockfish:bmi2"
              stockfish_avx512_tags="${stockfish_avx512_tags},${base_image}/stockfish:avx512"
              stockfish_vnni512_tags="${stockfish_vnni512_tags},${base_image}/stockfish:vnni512"
            fi
          done

          echo "frontend_tags=${frontend_tags}" >> $GITHUB_OUTPUT
          echo "frontend_full_tags=${frontend_full_tags}" >> $GITHUB_OUTPUT
          echo "backend_tags=${backend_tags}" >> $GITHUB_OUTPUT
          echo "stockfish_tags=${stockfish_tags}" >> $GITHUB_OUTPUT
          echo "stockfish_sse41_tags=${stockfish_sse41_tags}" >> $GITHUB_OUTPUT
          echo "stockfish_avx2_tags=${stockfish_avx2_tags}" >> $GITHUB_OUTPUT
          echo "stockfish_bmi2_tags=${stockfish_bmi2_tags}" >> $GITHUB_OUTPUT
          echo "stockfish_avx512_tags=${stockfish_avx512_tags}" >> $GITHUB_OUTPUT
          echo "stockfish_vnni512_tags=${stockfish_vnni512_tags}" >> $GITHUB_OUTPUT

          # Determine which services to build
          # For non-dispatch events, always build all services
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_frontend=${{ inputs.build_frontend }}" >> $GITHUB_OUTPUT
            echo "build_frontend_full=${{ inputs.build_frontend_full }}" >> $GITHUB_OUTPUT
            echo "build_backend=${{ inputs.build_backend }}" >> $GITHUB_OUTPUT
            echo "build_stockfish=${{ inputs.build_stockfish }}" >> $GITHUB_OUTPUT
          else
            echo "build_frontend=true" >> $GITHUB_OUTPUT
            echo "build_frontend_full=true" >> $GITHUB_OUTPUT
            echo "build_backend=true" >> $GITHUB_OUTPUT
            echo "build_stockfish=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        if: steps.meta.outputs.build_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        if: steps.meta.outputs.build_frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Full Image
        if: steps.meta.outputs.build_frontend_full == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.full
          push: true
          tags: ${{ steps.meta.outputs.frontend_full_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Stockfish Image (Generic x86-64)
        if: steps.meta.outputs.build_stockfish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./stockfish
          file: ./stockfish/Dockerfile
          build-args: STOCKFISH_ARCH=x86-64
          push: true
          tags: ${{ steps.meta.outputs.stockfish_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Stockfish Image (SSE4.1 Popcnt)
        if: steps.meta.outputs.build_stockfish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./stockfish
          file: ./stockfish/Dockerfile
          build-args: STOCKFISH_ARCH=x86-64-sse41-popcnt
          push: true
          tags: ${{ steps.meta.outputs.stockfish_sse41_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Stockfish Image (AVX2)
        if: steps.meta.outputs.build_stockfish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./stockfish
          file: ./stockfish/Dockerfile
          build-args: STOCKFISH_ARCH=x86-64-avx2
          push: true
          tags: ${{ steps.meta.outputs.stockfish_avx2_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Stockfish Image (BMI2)
        if: steps.meta.outputs.build_stockfish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./stockfish
          file: ./stockfish/Dockerfile
          build-args: STOCKFISH_ARCH=x86-64-bmi2
          push: true
          tags: ${{ steps.meta.outputs.stockfish_bmi2_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Stockfish Image (AVX512)
        if: steps.meta.outputs.build_stockfish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./stockfish
          file: ./stockfish/Dockerfile
          build-args: STOCKFISH_ARCH=x86-64-avx512
          push: true
          tags: ${{ steps.meta.outputs.stockfish_avx512_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Stockfish Image (VNNI512)
        if: steps.meta.outputs.build_stockfish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./stockfish
          file: ./stockfish/Dockerfile
          build-args: STOCKFISH_ARCH=x86-64-vnni512
          push: true
          tags: ${{ steps.meta.outputs.stockfish_vnni512_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
