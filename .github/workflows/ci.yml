name: CI Build Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-check:
    name: Backend Build Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Build Go API Service
        run: go build -v -o /dev/null ./cmd/api

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Build
        run: npm run build

  docker-check:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker Compose Build
        run: docker compose build

      - name: Verify Frontend Production Image Build
        run: docker build -f frontend/Dockerfile -t chess-frontend-ci ./frontend

      - name: Verify Frontend Full Image Build
        run: docker build -f frontend/Dockerfile.full -t chess-frontend-full-ci ./frontend
